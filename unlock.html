<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCPS_GEN_PRO - Admin Unlock</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#050510;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#111122;border:2px solid #00e5ff;border-radius:20px;width:100%;max-width:440px;padding:25px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,229,255,.2)}
.logo{font-size:24px;font-weight:900;color:#ff0055;letter-spacing:1px;margin-bottom:4px}
.sub{font-size:11px;font-weight:700;color:#00e5ff;font-family:monospace;margin-bottom:20px}
.box{background:#080815;border:1px solid #1a1a3a;border-radius:14px;padding:16px;margin-bottom:18px}
.label{font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.token-val{font-size:26px;font-weight:800;color:#00e5ff;font-family:Consolas,monospace;word-break:break-all}
.passkey-val{font-size:42px;font-weight:900;color:#00ff88;font-family:Consolas,monospace;letter-spacing:3px;margin:8px 0}
.btn{width:100%;padding:16px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0052cc,#0066ff);border:none;border-radius:30px;cursor:pointer}
.msg{font-size:12px;font-weight:800;color:#00ff88;margin-top:10px;display:none}
.restricted{color:#ff5577;font-weight:800;font-size:14px;line-height:1.5}
.input-key{width:100%;padding:12px;font-size:14px;background:#080815;border:1px solid #00e5ff;color:#fff;border-radius:8px;margin:10px 0 14px;outline:none}
.reset{font-size:11px;color:#8888aa;text-decoration:underline;cursor:pointer;margin-top:18px;display:inline-block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">&#128273; DCPS_GEN_PRO</div>
  <div class="sub">INSTANT MOBILE PASSKEY UNLOCKER</div>

  <div id="authBox" style="display:none">
    <div class="box"><div class="label">Daily Security Token</div><div class="token-val" id="tokenDisplay">---</div></div>
    <div class="box" style="border-color:#00ff88"><div class="label" style="color:#00ff88">Activation Passkey</div><div class="passkey-val" id="passkeyDisplay">------</div></div>
    <button class="btn" onclick="copyPasskey()">&#128203; TAP TO COPY PASSKEY</button>
    <div class="msg" id="copiedMsg">&#10004; COPIED! PASTE IN WHATSAPP</div>
  </div>

  <div id="restrictedBox" class="box" style="display:none">
    <div class="restricted">&#128274; Restricted Access<br>Administrator device not recognized.</div>
  </div>

  <div id="setupBox" style="display:none">
    <div class="label" style="color:#ffd700">Admin device authorization</div>
    <p style="font-size:12px;color:#ccc">Enter your Master Secret Key once on this phone:</p>
    <input type="password" id="masterKeyInput" class="input-key" placeholder="Master Secret Key" autocomplete="off">
    <button class="btn" style="background:linear-gradient(135deg,#00c853,#00e676)" onclick="saveMasterKey()">AUTHORIZE THIS DEVICE</button>
  </div>

  <div class="reset" onclick="showSetup()">Change stored master key</div>
</div>

<script>
const $ = id => document.getElementById(id);

async function calcPasskey(token, key) {
  const data = new TextEncoder().encode(token + key);
  const buf = await crypto.subtle.digest("SHA-256", data);
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  return String(parseInt(hex.substring(0, 8), 16) % 1000000).padStart(6, "0");
}

function getToken() {
  const p = new URLSearchParams(window.location.search);
  return p.get("token") || p.get("t") || "";
}

async function initApp() {
  ["authBox", "restrictedBox", "setupBox"].forEach(i => $(i).style.display = "none");
  const key = localStorage.getItem("DCPS_MASTER_KEY");
  if (!key) { $("restrictedBox").style.display = "block"; return; }   // unknown device
  const token = getToken();
  $("authBox").style.display = "block";
  if (token) {
    $("tokenDisplay").innerText = token;
    $("passkeyDisplay").innerText = await calcPasskey(token, key);
  } else {
    $("tokenDisplay").innerText = "NO TOKEN DETECTED";
    $("passkeyDisplay").innerText = "------";
  }
}

function showSetup() {
  ["authBox", "restrictedBox"].forEach(i => $(i).style.display = "none");
  $("setupBox").style.display = "block";
}

function saveMasterKey() {
  const k = $("masterKeyInput").value.trim();
  if (!k) return;
  localStorage.setItem("DCPS_MASTER_KEY", k);
  $("masterKeyInput").value = "";
  initApp();
}

function copyPasskey() {
  const pk = $("passkeyDisplay").innerText;
  if (!pk || pk === "------") return;
  const done = () => { $("copiedMsg").style.display = "block"; setTimeout(() => $("copiedMsg").style.display = "none", 2500); };
  navigator.clipboard.writeText(pk).then(done).catch(() => {
    const t = document.createElement("input");
    t.value = pk; document.body.appendChild(t); t.select();
    document.execCommand("copy"); document.body.removeChild(t); done();
  });
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
